name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  workflow-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --user pytest pyyaml
      - name: Validate package structure
        run: python3 tests/validate_package.py
      - name: Run workflow contract tests
        run: python3 -m pytest -q tests
      - name: Check patch whitespace
        run: git show --check --oneline HEAD
